name: Integrar avance AgroScan
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integrar.yml']
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar archivos de la entrega
        run: |
          git config user.name Alejandr0www
          git config user.email Alejandr0www@users.noreply.github.com
          git switch develop
          git switch feature/landing-page
          mkdir -p public/assets/{images,styles,scripts}
          echo '' | base64 -d > 'README.md'
          echo '' | base64 -d > 'public/index.html'
          echo '' | base64 -d > 'public/favicon.ico'
          echo '' | base64 -d > 'public/assets/styles/styles.css'
          echo '' | base64 -d > 'public/assets/images/papa.png'
          echo '' | base64 -d > 'public/assets/images/maiz.png'
          git add README.md public
          git commit -m 'feat: implementar landing de AgroScan'
          git switch develop
          git merge --no-ff feature/landing-page -m 'Integrar landing page'
          git switch -c feature/demo-cultivos
          mkdir -p public/assets/scripts
          echo '' | base64 -d > public/assets/scripts/main.js
          git add public/assets/scripts/main.js
          git commit -m 'feat: agregar demo de papa y maíz'
          git switch develop
          git merge --no-ff feature/demo-cultivos -m 'Integrar demo de cultivos'
          git switch main
          git merge --no-ff develop -m 'Publicar avance de AgroScan'
          git push --atomic origin main develop feature/landing-page feature/demo-cultivos
